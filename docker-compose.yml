version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: math-tutor-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - math-tutor-network
    command: redis-server --appendonly yes

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: math-tutor-backend
    environment:
      # Supabase (app data + LangGraph checkpointer)
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      # Redis
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # API keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      # Backboard (assistant ID is now per-user in Supabase profiles)
      - BACKBOARD_API_KEY=${BACKBOARD_API_KEY}
      - BACKBOARD_ASSISTANT_NAME=${BACKBOARD_ASSISTANT_NAME}
      # App
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ANONYMOUS_TOKEN_SECRET=${ANONYMOUS_TOKEN_SECRET}
      # Observability
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-multi-agent-tutor}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - math-tutor-network
    restart: unless-stopped

volumes:
  redis_data:


networks:
  math-tutor-network:
    driver: bridge
